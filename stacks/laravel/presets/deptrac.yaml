# Regras de dependência entre camadas (Deptrac 2 a 4; pacote deptrac/deptrac).
# As camadas são definidas por pasta (collector "directory"), que funciona em todas essas versões.
# Controllers falam com services, requests, resources e enums.
# Services falam com models, enums, events e jobs.
# Models só falam com enums. Ninguém da regra de negócio conhece Http.
deptrac:
    paths:
        - ./app
    layers:
        - name: Controllers
          collectors:
              - type: directory
                value: app/Http/Controllers/.*
        - name: Requests
          collectors:
              - type: directory
                value: app/Http/Requests/.*
        - name: Resources
          collectors:
              - type: directory
                value: app/Http/Resources/.*
        - name: Services
          collectors:
              - type: directory
                value: app/Services/.*
        - name: Models
          collectors:
              - type: directory
                value: app/Models/.*
        - name: Enums
          collectors:
              - type: directory
                value: app/Enums/.*
        - name: Events
          collectors:
              - type: directory
                value: app/(Events|Listeners)/.*
        - name: Jobs
          collectors:
              - type: directory
                value: app/Jobs/.*
    ruleset:
        Controllers:
            - Requests
            - Resources
            - Services
            - Models
            - Enums
        Requests:
            - Enums
        Resources:
            - Models
            - Enums
        Services:
            - Models
            - Enums
            - Events
            - Jobs
        Models:
            - Enums
        Events:
            - Models
            - Jobs
        Jobs:
            - Services
            - Models
            - Enums
        Enums: []
